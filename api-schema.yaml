    Auditoire:
      type: object
      description: Serializer pour les auditoires.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        department:
          type: integer
        department_name:
          type: string
          readOnly: true
        faculty_name:
          type: string
          readOnly: true
        university_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        users_count:
          type: string
          readOnly: true
      required:
      - created_at
      - department
      - department_name
      - faculty_name
      - id
      - name
      - university_name
      - updated_at
      - users_count
    AuditoireCreateUpdate:
      type: object
      description: Serializer pour création/modification d'auditoire.
      properties:
        name:
          type: string
          maxLength: 150
        department:
          type: integer
      required:
      - department
      - name
    AuditoireCreateUpdateRequest:
      type: object
      description: Serializer pour création/modification d'auditoire.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        department:
          type: integer
      required:
      - department
      - name
