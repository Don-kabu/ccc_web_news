      enum:
      - Académique
      - Événements
      - Urgences
      - Informations
      - Administrative
      - Culturel
      - Sportif
      type: string
      description: |-
        * `Académique` - Académique
        * `Événements` - Événements
        * `Urgences` - Urgences
        * `Informations` - Informations
        * `Administrative` - Administrative
        * `Culturel` - Culturel
        * `Sportif` - Sportif
