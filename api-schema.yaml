openapi: 3.0.3
info:
  title: CCC Web News API
  version: 1.0.0
  description: "\n    API complète pour la gestion des actualités universitaires.\n\
    \    \n    ## Authentification\n    Utilisez le token JWT dans le header Authorization:\
    \ Bearer <token>\n    \n    ## Fonctionnalités\n    - Gestion des utilisateurs\
    \ et universités\n    - Système de publication et modération d'actualités\n  \
    \  - Notifications personnalisables\n    - Analytics et statistiques\n    "
paths:
  /api/v1/analytics/news/:
    get:
      operationId: analytics_news_retrieve
      description: Récupère les statistiques détaillées des actualités pour les modérateurs.
      summary: Statistiques des actualités
      parameters:
      - in: query
        name: period
        schema:
          type: string
        description: Période (day, week, month, year)
      - in: query
        name: university_id
        schema:
          type: string
        description: ID de l'université
      tags:
      - News
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: Statistiques des actualités
        '403':
          description: Permissions insuffisantes
  /api/v1/auditoires/:
    get:
      operationId: auditoires_list
      description: Récupère la liste des auditoires avec possibilité de filtrer par
        département/faculté/université.
      summary: Lister les auditoires
      parameters:
      - in: query
        name: department
        schema:
          type: string
        description: ID du département
      - in: query
        name: department__faculty
        schema:
          type: string
        description: ID de la faculté
      - in: query
        name: department__faculty__university
        schema:
          type: string
        description: ID de l'université
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Universities
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditoireList'
          description: ''
    post:
      operationId: auditoires_create
      description: ViewSet pour la gestion des auditoires.
      tags:
      - auditoires
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditoireCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuditoireCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuditoireCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditoireCreateUpdate'
          description: ''
  /api/v1/auditoires/{id}/:
    get:
      operationId: auditoires_retrieve
      description: ViewSet pour la gestion des auditoires.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this auditoire.
        required: true
      tags:
      - auditoires
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auditoire'
          description: ''
    put:
      operationId: auditoires_update
      description: ViewSet pour la gestion des auditoires.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this auditoire.
        required: true
      tags:
      - auditoires
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditoireCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuditoireCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuditoireCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditoireCreateUpdate'
          description: ''
    patch:
      operationId: auditoires_partial_update
      description: ViewSet pour la gestion des auditoires.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this auditoire.
        required: true
      tags:
      - auditoires
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAuditoireCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAuditoireCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAuditoireCreateUpdateRequest'
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditoireCreateUpdate'
          description: ''
    delete:
      operationId: auditoires_destroy
      description: ViewSet pour la gestion des auditoires.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this auditoire.
        required: true
      tags:
      - auditoires
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '204':
          description: No response body
  /api/v1/auth/forgot-password/:
    post:
      operationId: auth_forgot_password_create
      description: Demande de réinitialisation de mot de passe par email.
      summary: Mot de passe oublié
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: Email de réinitialisation envoyé
        '400':
          description: Données invalides
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: "\n        Connecte un utilisateur avec son email et mot de passe.\n\
        \        \n        Si `remember_me` est True, le token aura une durée de vie\
        \ étendue (30 jours).\n        "
      summary: Connexion utilisateur
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
            examples:
              ConnexionStandard:
                value:
                  email: user@u-paris.fr
                  password: motdepasse123
                  rememberMe: false
                summary: Connexion standard
              ConnexionAvecRememberMe:
                value:
                  email: user@u-paris.fr
                  password: motdepasse123
                  rememberMe: true
                summary: Connexion avec remember me
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      security:
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: Connexion réussie
        '400':
          description: Données invalides
        '401':
          description: Identifiants incorrects
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Déconnecte l'utilisateur et invalide son token de rafraîchissement.
      summary: Déconnexion utilisateur
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
                  description: Token de rafraîchissement à invalider
              required:
              - refresh
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: Déconnexion réussie
        '400':
          description: Token invalide
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Renouvelle le token d'accès avec un token de rafraîchissement valide.
      summary: Renouveler le token JWT
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: Token renouvelé
        '401':
          description: Token de rafraîchissement invalide
  /api/v1/auth/register/university/:
    post:
      operationId: auth_register_university_create
      description: "\n    Crée simultanément une nouvelle université et un compte\
        \ administrateur.\n    Ce endpoint est utilisé pour l'onboarding des nouvelles\
        \ institutions.\n    "
      summary: Créer une nouvelle université et compte administrateur
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUniversityRequest'
            examples:
              CréationUniversité+Admin:
                value:
                  university_name: Université de Paris
                  university_type: Université
                  university_city: Paris
                  university_country: France
                  university_website: https://u-paris.fr
                  university_description: Description de l'université
                  admin_first_name: Jean
                  admin_last_name: Dupont
                  admin_email: admin@u-paris.fr
                  admin_password: motdepasse123
                  admin_phone: '+33612345678'
                summary: Création université + admin
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterUniversityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterUniversityRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '201':
          description: Université et administrateur créés avec succès
        '400':
          description: Données invalides
  /api/v1/auth/register/user/:
    post:
      operationId: auth_register_user_create
      description: "\n    Permet à un utilisateur de créer un compte dans une université\
        \ existante.\n    L'utilisateur peut choisir son rôle (STUDENT ou PUBLIANT).\n\
        \    "
      summary: Rejoindre une université existante
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
            examples:
              InscriptionÉtudiant:
                value:
                  first_name: Marie
                  last_name: Martin
                  email: marie@u-paris.fr
                  password: motdepasse123
                  phone: '+33612345678'
                  university_id: uuid
                  role: STUDENT
                summary: Inscription étudiant
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '201':
          description: Utilisateur créé avec succès
        '400':
          description: Données invalides
  /api/v1/auth/reset-password/:
    post:
      operationId: auth_reset_password_create
      description: Réinitialise le mot de passe avec un token valide.
      summary: Réinitialiser mot de passe
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: Mot de passe réinitialisé
        '400':
          description: Token invalide ou expiré
  /api/v1/departments/:
    get:
      operationId: departments_list
      description: Récupère la liste des départements avec possibilité de filtrer
        par faculté/université.
      summary: Lister les départements
      parameters:
      - in: query
        name: faculty
        schema:
          type: string
        description: ID de la faculté
      - in: query
        name: faculty__university
        schema:
          type: string
        description: ID de l'université
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Universities
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartmentList'
          description: ''
    post:
      operationId: departments_create
      description: ViewSet pour la gestion des départements.
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepartmentCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentCreateUpdate'
          description: ''
  /api/v1/departments/{id}/:
    get:
      operationId: departments_retrieve
      description: ViewSet pour la gestion des départements.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this department.
        required: true
      tags:
      - departments
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
    put:
      operationId: departments_update
      description: ViewSet pour la gestion des départements.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this department.
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartmentCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepartmentCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentCreateUpdate'
          description: ''
    patch:
      operationId: departments_partial_update
      description: ViewSet pour la gestion des départements.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this department.
        required: true
      tags:
      - departments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDepartmentCreateUpdateRequest'
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentCreateUpdate'
          description: ''
    delete:
      operationId: departments_destroy
      description: ViewSet pour la gestion des départements.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this department.
        required: true
      tags:
      - departments
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '204':
          description: No response body
  /api/v1/faculties/:
    get:
      operationId: faculties_list
      description: Récupère la liste des facultés avec possibilité de filtrer par
        université.
      summary: Lister les facultés
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Recherche dans nom de faculté/université
      - in: query
        name: university
        schema:
          type: string
        description: ID de l'université
      tags:
      - Universities
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFacultyList'
          description: ''
    post:
      operationId: faculties_create
      description: Crée une nouvelle faculté dans une université.
      summary: Créer une faculté
      tags:
      - Universities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FacultyCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FacultyCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyCreateUpdate'
          description: ''
  /api/v1/faculties/{id}/:
    get:
      operationId: faculties_retrieve
      description: ViewSet pour la gestion des facultés.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this faculty.
        required: true
      tags:
      - faculties
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faculty'
          description: ''
    put:
      operationId: faculties_update
      description: ViewSet pour la gestion des facultés.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this faculty.
        required: true
      tags:
      - faculties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FacultyCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FacultyCreateUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyCreateUpdate'
          description: ''
    patch:
      operationId: faculties_partial_update
      description: ViewSet pour la gestion des facultés.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this faculty.
        required: true
      tags:
      - faculties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFacultyCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFacultyCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFacultyCreateUpdateRequest'
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyCreateUpdate'
          description: ''
    delete:
      operationId: faculties_destroy
      description: ViewSet pour la gestion des facultés.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this faculty.
        required: true
      tags:
      - faculties
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '204':
          description: No response body
  /api/v1/news/:
    get:
      operationId: news_list
      description: "\n        Récupère la liste paginée des actualités avec filtres\
        \ avancés.\n        \n        Les utilisateurs non connectés voient seulement\
        \ les actualités approuvées.\n        Les utilisateurs connectés voient aussi\
        \ leurs propres brouillons.\n        Les modérateurs peuvent voir toutes les\
        \ actualités de leur université.\n        "
      summary: Lister les actualités
      parameters:
      - in: query
        name: author
        schema:
          type: string
        description: Filtrer par auteur (ID)
      - in: query
        name: category
        schema:
          type: string
        description: Filtrer par catégorie
      - in: query
        name: dateFrom
        schema:
          type: string
        description: Date de début (ISO format)
      - in: query
        name: dateTo
        schema:
          type: string
        description: Date de fin (ISO format)
      - in: query
        name: importance
        schema:
          type: string
        description: Filtrer par importance (urgente, importante, moyenne, faible)
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Tri (ex: -published_at, title)'
      - in: query
        name: page
        schema:
          type: integer
        description: Numéro de page
      - in: query
        name: page_size
        schema:
          type: integer
        description: Nombre d'éléments par page
      - in: query
        name: search
        schema:
          type: string
